[project]
name = "pitch-analytics"
version = "0.1.0"
description = "Ambiente de analise de dados, visualizacao e storytelling para o pitch do Agente Otimizador"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "google-cloud-bigquery>=3.20.0",
    "db-dtypes>=1.2.0",
    "pyarrow>=15.0.0",
    "ipykernel>=6.29.0",
    "nbformat>=5.9.0",
    "nbclient>=0.10.0"
]

[tool.uv]
package = false

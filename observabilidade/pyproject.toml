[project]
name = "observabilidade-itau"
version = "0.1.0"
description = "Observabilidade do Agente Otimizador: intervenções, avisos proativos, ajustes, feedback e impacto de longo prazo."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-cloud-bigquery>=3.25",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

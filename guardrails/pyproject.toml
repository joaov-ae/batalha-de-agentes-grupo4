[project]
name = "guardrails-itau"
version = "0.1.0"
description = "Guardrails de entrada e saída do Agente Otimizador: regras determinísticas + Gemini + Model Armor."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "google-genai>=1.20",
    "google-cloud-modelarmor>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[project]
name = "data-manager-itau"
version = "0.1.0"
description = "Camada de dados e tools do Agente Otimizador: status do cliente, projeção de saldo e ajustes."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-cloud-bigquery>=3.25",
    "google-cloud-run>=0.10",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
